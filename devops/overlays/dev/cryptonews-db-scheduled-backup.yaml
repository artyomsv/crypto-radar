apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cryptonews-db-daily-backup
  labels:
    app.kubernetes.io/name: cryptonews-db
    app.kubernetes.io/part-of: projectr-x
spec:
  # Daily at 04:15 UTC (offset from marketdata to spread load)
  schedule: "0 15 4 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: cryptonews-db
  backupOwnerReference: self

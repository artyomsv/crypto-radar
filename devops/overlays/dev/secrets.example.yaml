# =============================================================================
# secrets.example.yaml — TEMPLATE ONLY
# =============================================================================
# This file is committed to git and contains NO real secrets.
# To deploy:
#   1. cp secrets.example.yaml secrets.yaml
#   2. Replace every REPLACE_ME placeholder with the real value
#   3. kubectl apply -f secrets.yaml
#
# secrets.yaml is in devops/.gitignore and will not be committed.
#
# Note: Database passwords (marketdata-db-app, cryptonews-db-app) are
# generated automatically by the CloudNativePG operator at cluster bootstrap.
# You do NOT create those Secrets manually.
# =============================================================================

---
# Application API keys consumed by whale-service and signal-service.
# Both keys are optional in the Deployments — services will start without
# them but the corresponding integrations will be inactive.
apiVersion: v1
kind: Secret
metadata:
  name: projectr-x-api-keys
  namespace: crypto-radar
type: Opaque
stringData:
  # https://developer.whale-alert.io  (free tier available)
  WHALE_ALERT_API_KEY: "REPLACE_ME"
  # https://aistudio.google.com/apikey
  GEMINI_API_KEY: "REPLACE_ME"

---
# S3 (or S3-compatible) credentials used by Barman Cloud for CNPG backups.
# Used by both ObjectStore resources (marketdata-backup-store,
# cryptonews-backup-store).
apiVersion: v1
kind: Secret
metadata:
  name: backup-s3-credentials
  namespace: crypto-radar
type: Opaque
stringData:
  ACCESS_KEY_ID: "REPLACE_ME"
  ACCESS_SECRET_KEY: "REPLACE_ME"

---
# trade-execution-service secrets: AES-256 master key for encrypting exchange
# API credentials at rest, and the JDBC credentials for the marketdata DB
# (trade-execution owns the exchange_accounts / executed_trades / execution_events
# tables under the marketdata database).
#
# Generate EXECUTION_MASTER_KEY with:
#   openssl rand -base64 32
apiVersion: v1
kind: Secret
metadata:
  name: trade-execution-service-secrets
  namespace: crypto-radar
type: Opaque
stringData:
  EXECUTION_MASTER_KEY: "REPLACE_WITH_BASE64_32_BYTE_AES256_KEY"
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://marketdata-db-rw:5432/marketdata"
  QUARKUS_DATASOURCE_USERNAME: "cryptoradar"
  QUARKUS_DATASOURCE_PASSWORD: "REPLACE_WITH_DB_PASSWORD"

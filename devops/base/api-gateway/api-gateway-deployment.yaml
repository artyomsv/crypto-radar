apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: projectr-x
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: projectr-x
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
    spec:
      serviceAccountName: projectr-x-sa
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done; echo "redis ready"']
        - name: wait-for-market-data
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z market-data-service 8081; do echo "Waiting for market-data-service..."; sleep 3; done']
        - name: wait-for-news
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z news-service 8082; do echo "Waiting for news-service..."; sleep 3; done']
        - name: wait-for-analytics
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z analytics-service 8083; do echo "Waiting for analytics-service..."; sleep 3; done']
        - name: wait-for-whale
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z whale-service 8084; do echo "Waiting for whale-service..."; sleep 3; done']
        - name: wait-for-derivatives
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z derivatives-service 8085; do echo "Waiting for derivatives-service..."; sleep 3; done']
        - name: wait-for-signal
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z signal-service 8086; do echo "Waiting for signal-service..."; sleep 3; done']
      containers:
        - name: api-gateway
          image: ghcr.io/stukans/projectr-x-api-gateway:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: api-gateway-env-config
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10

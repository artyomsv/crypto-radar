apiVersion: apps/v1
kind: Deployment
metadata:
  name: derivatives-service
  labels:
    app.kubernetes.io/name: derivatives-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: projectr-x
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: derivatives-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: derivatives-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: projectr-x
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/q/metrics"
    spec:
      serviceAccountName: projectr-x-sa
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done; echo "redis ready"']
        - name: wait-for-marketdata-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z marketdata-db-rw 5432; do echo "Waiting for marketdata-db..."; sleep 5; done; echo "marketdata-db ready"']
      containers:
        - name: derivatives-service
          image: ghcr.io/stukans/projectr-x-derivatives-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: derivatives-service-env-config
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: marketdata-db-app
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketdata-db-app
                  key: password
          ports:
            - name: http
              containerPort: 8085
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10

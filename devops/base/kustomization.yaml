apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = stateless app, environment-agnostic.
# Database Cluster, ObjectStore, ScheduledBackup, namespace and ingress live
# in the overlay (overlays/dev/).

resources:
  - serviceaccount/
  - redis/
  - market-data-service/
  - news-service/
  - analytics-service/
  - whale-service/
  - derivatives-service/
  - signal-service/
  - trade-execution-service/
  - api-gateway/
  - frontend/

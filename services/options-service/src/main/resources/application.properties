quarkus.application.name=options-service
quarkus.http.port=8088
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000,http://api-gateway:8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${TIMESCALE_PASSWORD:cryptoradar_ts_pass}
# Schema is managed by db/init/options-init.sql — don't let Hibernate generate or drop.
quarkus.hibernate-orm.database.generation=none

quarkus.redis.hosts=redis://localhost:6379

bybit.rest-base=https://api.bybit.com

# Polling cadence — kept conservative to stay within Bybit's 1200 weight/min budget.
scheduler.instruments.interval=30m
scheduler.tickers.interval=60s
scheduler.historical-vol.interval=5m
scheduler.opportunity-scan.interval=60s

# Underlyings to track (Bybit options baseCoin). Comma-separated.
options.underlyings=BTC,ETH,SOL,XAUT,XRP,MNT,DOGE

# Strangle horizon — only ingest contracts with expiry within this window.
options.max-expiry-days=4

# Opportunity scoring — confidence above this fires a Redis alert + writes row.
options.opportunity.confidence-threshold=75.0

quarkus.log.category."com.cryptoradar".level=INFO

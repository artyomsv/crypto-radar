# Test-only Quarkus configuration.
#
# CRITICAL: Never change jdbc.url back to the live dev database name
# (localhost:31432/marketdata). The tests' @BeforeEach / @AfterEach call
# accountRepo.deleteAll() + tradeRepo.deleteAll() + eventRepo.deleteAll()
# — if those run against /marketdata they wipe the developer's registered
# exchange accounts, open trades, and event history (happened 2026-04-21).
#
# Tests use a dedicated /marketdata_test DB on the same TimescaleDB
# container. The schema was pre-applied from db/init/execution-init.sql;
# see the project README for recreation steps.
#
# LiveDbGuard asserts at test startup that the URL targets a *_test
# database and not /marketdata — defence-in-depth against regressions.

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:31432/marketdata_test
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=cryptoradar_ts_pass
quarkus.hibernate-orm.database.generation=none

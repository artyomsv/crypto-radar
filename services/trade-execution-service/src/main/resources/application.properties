quarkus.application.name=trade-execution-service
quarkus.http.port=8087
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000,http://api-gateway:8080

# Redis (subscribe to crypto:signals)
quarkus.redis.hosts=redis://localhost:6379

# Datasource — same marketdata DB as signal-service. URL is overridable so
# tests (or CI) can point at an isolated database via env var without
# editing this file. See techdebt 3-2-hardcoded-jdbc-url-blocks-test-isolation.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5433/marketdata}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:cryptoradar}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:${TIMESCALE_PASSWORD:cryptoradar_ts_pass}}
quarkus.hibernate-orm.database.generation=none

# Execution service config
execution.master-key=${EXECUTION_MASTER_KEY}
execution.mainnet.enabled=${EXECUTION_MAINNET_ENABLED:false}
execution.dev-mode.enabled=${EXECUTION_DEV_MODE_ENABLED:false}
execution.reconcile.interval=60s
execution.trail.interval=60s

# Market-data URL (for current price during trail calc)
market-data.url=${MARKET_DATA_URL:http://localhost:8081}

# Bybit base URLs (per environment — picked per exchange_account row)
bybit.demo.rest-base=https://api-demo.bybit.com
bybit.demo.ws-private=wss://stream-demo.bybit.com/v5/private
bybit.mainnet.rest-base=https://api.bybit.com
bybit.mainnet.ws-private=wss://stream.bybit.com/v5/private

# Clock sync — signed requests are timestamped from Bybit server time (read from
# the unsigned /v5/market/time), not the host clock, so host drift (Docker/WSL
# sleep) can't trip retCode=10002. Primed at startup, refreshed on this interval,
# and force-resynced on any residual 10002. sync-environment picks which public
# endpoint to read server time from (offset is host-side, identical per env).
bybit.clock.sync-interval=30s
bybit.clock.sync-environment=MAINNET

# Turtle / Donchian live execution (Plan 2). Long-horizon strategies are kept
# out of intraday stagnation/trail exits and closed by the Donchian monitor.
execution.long-horizon-strategies=donchian,turtle-s1,turtle-s2
execution.donchian-exit.enabled=true
execution.donchian-exit.interval=60s

quarkus.log.category."com.cryptoradar".level=INFO

quarkus.application.name=whale-service
quarkus.http.port=8084
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://api-gateway:8080

# Datasource (TimescaleDB - same as market-data)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${TIMESCALE_PASSWORD:cryptoradar_ts_pass}

# Redis
quarkus.redis.hosts=redis://localhost:6379

# Whale detection
# Thresholds are tiered per coin in AbstractExchangeStreamProvider:
# BTC/ETH/BNB: $5K | BCH/ZEC/XMR/SOL/LTC: $1K | Others: $500
whale.binance.ws.url=wss://stream.binance.com:9443/stream

# Whale Alert API (optional, Phase 2 — set WHALE_ALERT_API_KEY env var to enable)
whale.alert.api.url=https://api.whale-alert.io/v1

# Scheduler
scheduler.flow.interval=10s
scheduler.analytics.interval=30s

quarkus.log.category."com.cryptoradar".level=INFO

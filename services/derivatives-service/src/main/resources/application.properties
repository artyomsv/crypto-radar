quarkus.application.name=derivatives-service
quarkus.http.port=8085
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000,http://api-gateway:8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${TIMESCALE_PASSWORD:cryptoradar_ts_pass}

quarkus.redis.hosts=redis://localhost:6379

binance.futures.base-url=https://fapi.binance.com
# Aggressive refresh — Binance Futures has 2400 weight/min, we use ~6%
scheduler.funding.interval=10s
scheduler.openinterest.interval=10s
scheduler.longshort.interval=15s

# Feed staleness monitor — WARNs (and serves /api/derivatives/feed-health) when a
# feed table's newest row is older than its per-feed budget (minutes). Event-driven
# feeds (liquidations) get generous windows so a quiet market is not a false alarm.
monitor.staleness.interval=5m
monitor.staleness.feeds=funding_rates:5,open_interest:5,long_short_ratio:15,liquidations:60,option_snapshots:10,option_historical_vol:30,candles:10,price_snapshots:10

quarkus.log.category."com.cryptoradar".level=INFO

quarkus.application.name=api-gateway
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Redis
quarkus.redis.hosts=redis://localhost:6379

# Backend services
market-data.url=http://localhost:8081
news-service.url=http://localhost:8082
analytics-service.url=http://localhost:8083
whale-service.url=http://localhost:8084
derivatives-service.url=http://localhost:8085
signal-service.url=http://localhost:8086
execution.url=http://localhost:8087
execution.ws.url=ws://localhost:8087/ws/execution
options-service.url=http://localhost:8088

quarkus.log.category."com.cryptoradar".level=INFO

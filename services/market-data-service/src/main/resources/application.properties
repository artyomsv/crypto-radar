quarkus.application.name=market-data-service
quarkus.http.port=8081
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Datasource (TimescaleDB)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=cryptoradar_ts_pass
quarkus.hibernate-orm.database.generation=none

# Redis
quarkus.redis.hosts=redis://localhost:6379

# Binance API
binance.api.base-url=https://api.binance.com
binance.api.klines-path=/api/v3/klines
binance.api.ticker-path=/api/v3/ticker/24hr

# Scheduler
scheduler.candle.interval=60s
scheduler.price.interval=15s

# Logging
quarkus.log.category."com.cryptoradar".level=INFO

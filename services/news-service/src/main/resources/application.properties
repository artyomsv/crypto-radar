quarkus.application.name=news-service
quarkus.http.port=8082
quarkus.http.cors=true
quarkus.http.cors.origins=*

# Datasource (PostgreSQL)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5434/cryptonews
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${POSTGRES_PASSWORD:cryptoradar_pg_pass}
quarkus.hibernate-orm.database.generation=none

# Redis
quarkus.redis.hosts=redis://localhost:6379

# CoinDesk News API (formerly CryptoCompare — free, no key required)
news.api.base-url=https://data-api.coindesk.com
news.api.articles-path=/news/v1/article/list

# Scheduler
scheduler.news.interval=120s

# Logging
quarkus.log.category."com.cryptoradar".level=INFO

quarkus.application.name=signal-service
quarkus.http.port=8086
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000,http://api-gateway:8080

quarkus.redis.hosts=redis://localhost:6379

# Datasource (TimescaleDB — signal_outcomes hypertable)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${TIMESCALE_PASSWORD:cryptoradar_ts_pass}
quarkus.hibernate-orm.database.generation=none

# Service URLs
market-data.url=${MARKET_DATA_URL:http://localhost:8081}
analytics.url=${ANALYTICS_SERVICE_URL:http://localhost:8083}
whale.url=${WHALE_SERVICE_URL:http://localhost:8084}
derivatives.url=${DERIVATIVES_SERVICE_URL:http://localhost:8085}

scheduler.signal.interval=5s

# AI probability gate (Phase 1, shadow) — hourly scan, 15m shadow evaluation,
# 6h logistic-model retrain. Shadow only; no live execution effect.
probability.scan.interval=1h
probability.eval.interval=15m
probability.model.retrain-interval=6h
# Phase 2 (data-driven from shadow backtest): the dimension-score direction was
# anti-predictive in the ranging window (MAE ~4x MFE) and 2:1 targets rarely hit,
# so invert direction + use 1:1 geometry, tagged so calibration stays per-config.
# Still shadow — validating the flip out-of-sample before any live promotion.
probability.config-tag=v2-1to1-flip
probability.geometry.stop-atr-mult=1.5
probability.geometry.target-r=1.0
probability.direction.invert=true
probability.calibrator.retrain-interval=1h
# --- Parallel generators (each a CDI CandidateGenerator bean) ---
# Flip (v2 control) keeps its original geometry/direction knobs above.
probability.generator.flip.enabled=true
probability.generator.flip.run-llm=true
# v3 feature-direction: direction from a logistic over candle indicators, same 1:1
# geometry as the flip so direction is the only changed variable. Shadow only.
probability.generator.feature-dir.tag=v3-feature-dir
probability.generator.feature-dir.enabled=true
probability.generator.feature-dir.run-llm=true
probability.generator.feature-dir.stop-atr-mult=1.5
probability.generator.feature-dir.target-r=1.0
# v4-feature-dir-trail: identical entries to v3, scored with a trailing-stop exit
# (TrailConfig.DEFAULT ladder) instead of a fixed 1:1 target. A mid-experiment
# backtest of v3's realized paths showed trailing ~triples EV at the same win
# rate; this tag accrues a live out-of-sample track to confirm it. LLM off (same
# candidates as v3 — geometry is the only variable). Evaluator applies trailing
# for any tag in probability.eval.trailing-tags.
probability.generator.feature-dir-trail.tag=v4-feature-dir-trail
probability.generator.feature-dir-trail.enabled=true
probability.generator.feature-dir-trail.run-llm=false
# v5-feature-dir-early: same v3 entries, EARLY-activation trail (activate 0.5R,
# lock ~0.2R) vs v4's DEFAULT (activate 1.0R, lock 0.5R). Backtested to rescue the
# fat 0.5-1.5R tag-and-reverse population (win 56%->71%); live shadow confirms it
# survives real fills. v4 kept running alongside for the historical comparison.
probability.generator.feature-dir-early.tag=v5-feature-dir-early
probability.generator.feature-dir-early.enabled=true
probability.generator.feature-dir-early.run-llm=false
probability.eval.trailing-tags=v4-feature-dir-trail,v5-feature-dir-early
probability.eval.trail.v5.tag=v5-feature-dir-early
probability.eval.trail.v5.activation-r=0.5
probability.eval.trail.v5.step-r=0.05
probability.eval.trail.v5.offset-r=0.3
# Direction model training (real historical 1h candles; forward 1:1 label).
probability.direction-model.retrain-interval=6h
probability.direction-model.hold-hours=72
probability.direction-model.lookback-days=60

# Gemini AI analysis (optional — set GEMINI_API_KEY env var to enable)
gemini.api.key=${GEMINI_API_KEY:}

quarkus.log.category."com.cryptoradar".level=INFO

# Turtle / Donchian breakout detectors (Plan 1). Each detector also defaults
# true via @ConfigProperty; these lines make the knobs discoverable + flippable.
turtle.donchian.enabled=true
turtle.s1.enabled=true
turtle.s2.enabled=true

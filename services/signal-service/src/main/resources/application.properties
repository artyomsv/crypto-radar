quarkus.application.name=signal-service
quarkus.http.port=8086
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:31000,http://api-gateway:8080

quarkus.redis.hosts=redis://localhost:6379

# Datasource (TimescaleDB — signal_outcomes hypertable)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketdata
quarkus.datasource.username=cryptoradar
quarkus.datasource.password=${TIMESCALE_PASSWORD:cryptoradar_ts_pass}
quarkus.hibernate-orm.database.generation=none

# Service URLs
market-data.url=${MARKET_DATA_URL:http://localhost:8081}
analytics.url=${ANALYTICS_SERVICE_URL:http://localhost:8083}
whale.url=${WHALE_SERVICE_URL:http://localhost:8084}
derivatives.url=${DERIVATIVES_SERVICE_URL:http://localhost:8085}

scheduler.signal.interval=5s

# AI probability gate (Phase 1, shadow) — hourly scan, 15m shadow evaluation,
# 6h logistic-model retrain. Shadow only; no live execution effect.
probability.scan.interval=1h
probability.eval.interval=15m
probability.model.retrain-interval=6h
# Phase 2 (data-driven from shadow backtest): the dimension-score direction was
# anti-predictive in the ranging window (MAE ~4x MFE) and 2:1 targets rarely hit,
# so invert direction + use 1:1 geometry, tagged so calibration stays per-config.
# Still shadow — validating the flip out-of-sample before any live promotion.
probability.config-tag=v2-1to1-flip
probability.geometry.stop-atr-mult=1.5
probability.geometry.target-r=1.0
probability.direction.invert=true
probability.calibrator.retrain-interval=1h

# Gemini AI analysis (optional — set GEMINI_API_KEY env var to enable)
gemini.api.key=${GEMINI_API_KEY:}

quarkus.log.category."com.cryptoradar".level=INFO

# Turtle / Donchian breakout detectors (Plan 1). Each detector also defaults
# true via @ConfigProperty; these lines make the knobs discoverable + flippable.
turtle.donchian.enabled=true
turtle.s1.enabled=true
turtle.s2.enabled=true

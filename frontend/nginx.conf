server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve upstream hostnames via Docker's embedded DNS every 10s.
    # Without this, nginx caches the api-gateway container's IP at startup;
    # any rebuild of api-gateway hands it a new IP and every proxied request
    # hits 502 until nginx itself is restarted. The `set $upstream ...;` +
    # `proxy_pass http://$upstream...` pattern below forces re-resolution
    # on each request (nginx only re-resolves variables, not static names).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # WebSocket proxy.
    # With a variable upstream, proxy_pass MUST NOT carry a URI; nginx then
    # forwards the original $request_uri unchanged. We use $request_uri here
    # to keep the path semantics identical to the old hard-coded form.
    location /ws/ {
        set $upstream_ws api-gateway:8080;
        proxy_pass http://$upstream_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API proxy to gateway. Same variable-upstream rule as the /ws/ block —
    # pass the request URI through unchanged.
    location /api/ {
        set $upstream_api api-gateway:8080;
        proxy_pass http://$upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
